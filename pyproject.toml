[project]
name = "macnexus"
version = "0.1.0"
description = "MacNexus System Management Suite"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8",
    "psutil>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"