
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macnexus"
version = "0.1.0"
description = "MacNexus System Management Suite"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # помилки стилю коду
    "F",    # потенційні помилки та невикористані імпорти
    "I",    # порядок імпортів
    "UP",   # рекомендації щодо сучасного Python
    "B",    # поширені помилки
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
